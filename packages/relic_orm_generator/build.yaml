builders:
  relic_orm:
    import: "package:relic_orm_generator/relic_orm_generator.dart"
    builder_factories: ["relicBuilder"]
    build_extensions: {".dart": [".relic_orm.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]

  relic_orm_init:
    import: "package:relic_orm_generator/relic_orm_generator.dart"
    builder_factories: ["relicInitBuilder"]
    build_extensions: {"$lib$": ["relic.init.dart"]}
    auto_apply: root_package
    build_to: source
    runs_before: ["relic_orm_generator:relic_orm"]

