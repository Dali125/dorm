name: relic_orm_generator
description: "Code generator for relic: automatically generates toMap, fromMap, copyWith, schema definitions, and registration."
version: 0.1.0
homepage: https://github.com/Dali125/relic_orm
repository: https://github.com/Dali125/relic_orm/tree/main/packages/relic_orm_generator
issue_tracker: https://github.com/Dali125/relic_orm/issues

environment:
  sdk: ^3.13.5

dependencies:
  build: ^2.4.1
  source_gen: ^1.5.0
  analyzer: ^6.4.1
  glob: ^2.1.2
  relic_orm:
    path: ../relic_orm

dev_dependencies:
  build_test: ^2.2.0
  test: ^1.25.0
  flutter_lints: ^6.0.0
