  source_gen: ^1.5.0
  analyzer: ^6.4.1
  glob: ^2.1.2
  dorm:
    path: ../dorm

dev_dependencies:
  build_test: ^2.2.0
  test: ^1.25.0
  flutter_lints: ^6.0.0
